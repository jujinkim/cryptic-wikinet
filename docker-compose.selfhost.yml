name: cryptic-wikinet

x-web-common: &web-common
  build:
    context: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  environment:
    NODE_ENV: production
    MEDIA_STORAGE_DRIVER: s3
    S3_ENDPOINT: http://minio:9000
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${MINIO_BUCKET:-cryptic-media}
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    S3_FORCE_PATH_STYLE: "true"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
      ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-cryptic_bootstrap}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_PROD_DB:-cryptic_prod},${POSTGRES_STAGING_DB:-cryptic_staging}
    volumes:
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/postgres:/var/lib/postgresql/data
      - ./ops/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/minio:/data
    ports:
      - ${MINIO_CONSOLE_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-cryptic-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2;
        done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set download "local/$${MINIO_BUCKET}";
    restart: "no"

  web-prod:
    <<: *web-common
    env_file:
      - path: ./ops/docker/env/prod.env
        required: false
    environment:
      NODE_ENV: production
      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-cryptic-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_PUBLIC_BASE_URL: ${PROD_MEDIA_PUBLIC_BASE_URL:-https://www.crypticwiki.net/media}
      S3_FORCE_PATH_STYLE: "true"
    command:
      [
        "/bin/sh",
        "-c",
        "npx prisma migrate deploy && npm run start -- --hostname 0.0.0.0 --port 3000",
      ]

  web-staging:
    <<: *web-common
    env_file:
      - path: ./ops/docker/env/staging.env
        required: false
    environment:
      NODE_ENV: production
      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-cryptic-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_PUBLIC_BASE_URL: ${STAGING_MEDIA_PUBLIC_BASE_URL:-http://192.168.1.111:3001/media}
      S3_FORCE_PATH_STYLE: "true"
    command:
      [
        "/bin/sh",
        "-c",
        "npx prisma migrate deploy && npm run start -- --hostname 0.0.0.0 --port 3000",
      ]

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    depends_on:
      web-prod:
        condition: service_healthy
      web-staging:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@crypticwiki.net}
      CANONICAL_DOMAIN: ${CANONICAL_DOMAIN:-www.crypticwiki.net}
      APEX_DOMAIN: ${APEX_DOMAIN:-crypticwiki.net}
      MINIO_BUCKET: ${MINIO_BUCKET:-cryptic-media}
    ports:
      - ${PUBLIC_HTTP_BIND_IP:-127.0.0.1}:80:80
      - ${PUBLIC_HTTPS_BIND_IP:-127.0.0.1}:443:443
      - ${STAGING_BIND_IP:-127.0.0.1}:${STAGING_HTTP_PORT:-3001}:3001
    volumes:
      - ./ops/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/caddy/data:/data
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/caddy/config:/config

  article-retention-cron:
    image: curlimages/curl:8.15.0
    restart: unless-stopped
    depends_on:
      web-prod:
        condition: service_healthy
    env_file:
      - path: ./ops/docker/env/prod.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep $${ARTICLE_RETENTION_INITIAL_DELAY_SECONDS:-60};
        while true; do
          curl -fsS -H "Authorization: Bearer $${CRON_SECRET}" http://web-prod:3000/api/cron/article-retention || true;
          sleep $${ARTICLE_RETENTION_INTERVAL_SECONDS:-86400};
        done

  backup:
    build:
      context: ./ops/docker/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./ops/docker/env/backup.env
        required: false
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
    volumes:
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/minio:/minio:ro
      - ${DATA_ROOT:-/srv/cryptic-wikinet}/backup-work:/backup-work
    command: ["/usr/local/bin/backup-loop.sh"]
